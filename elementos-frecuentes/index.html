<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario Elementos Frecuentes ST</title>
<style>
body{font-family:Segoe UI,Tahoma,sans-serif;background:#f0f2f5;margin:0;padding:20px;color:#333}.container{max-width:1300px;margin:auto;display:grid;grid-template-columns:1fr 430px;gap:20px}@media(max-width:950px){.container{grid-template-columns:1fr}.output-box{position:static!important}}.card{background:#fff;padding:18px;border-radius:10px;box-shadow:0 4px 8px rgba(0,0,0,.07)}h2,h3{margin-top:0;color:#1e3d59;border-bottom:2px solid #ff9800;padding-bottom:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccc;border-radius:5px;font-size:14px}.section{border:1px solid #ddd;border-radius:8px;margin-top:12px;overflow:hidden;background:#fff}.section-header{display:flex;align-items:center;gap:10px;background:#1e3d59;color:#fff;padding:10px 12px;font-weight:700}.section-header input{width:auto;transform:scale(1.15)}.section-body{display:none;padding:10px 12px}.section.active .section-body{display:block}.item-row{display:grid;grid-template-columns:115px 1fr 55px 90px;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:7px 0}.item-row:last-child{border-bottom:none}.code{font-family:Consolas,monospace;color:#b71c1c;font-weight:700;font-size:13px}.name{font-size:13px}.qty{text-align:center;font-weight:700}.qty:disabled{background:#f2f2f2;color:#999}textarea{width:100%;height:390px;box-sizing:border-box;font-family:Consolas,monospace;font-size:12px;padding:10px;border:1px solid #c8e6c9;border-radius:5px;background:#fafafa;resize:vertical}.output-box{background:#e8f5e9;border:2px dashed #2e7d32;position:sticky;top:20px}.btn{border:0;width:100%;padding:12px;border-radius:5px;color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}.btn-copy{background:#2e7d32}.btn-clear{background:#777}.btn-wa{background:#25D366;color:#063b1a}.btn-gen{background:#1e3d59}.note{font-size:12px;color:#555;margin:6px 0 12px}
</style>
</head>
<body>
<div class="container"><div class="card"><h2>Elementos Frecuentes Servicio Técnico</h2>
<div class="grid"><div><label for="equipo">Equipo *</label><input id="equipo" placeholder="Ej: BAP-0314" oninput="generarSalida()"></div><div><label for="om">Numero de OM</label><input id="om" placeholder="Opcional"></div><div><label for="modelo">Modelo / Kit FILALO</label><select id="modelo" onchange="seleccionarKit()"><option value="">Seleccionar kit de filtros...</option></select></div><div><label for="busqueda">Buscar código o descripción</label><input id="busqueda" placeholder="Ej: paños, ELE000601, 1250AJP" oninput="filtrarItems()"></div></div><div id="formulario"></div></div>
<div class="card output-box"><h3>Salida para Excel / SAP</h3><p class="note">Formato: Código, Descripción, Unidad, Cantidad y Equipo. Los códigos repetidos se suman automáticamente.</p><textarea id="salida" readonly></textarea><button class="btn btn-gen" onclick="generarSalida(true)">Generar salida</button><button class="btn btn-copy" onclick="copiarSalida()">Copiar al portapapeles</button><button class="btn btn-wa" onclick="enviarWhatsApp()">Enviar a WhatsApp</button><button class="btn btn-clear" onclick="limpiarFormulario()">Limpiar formulario</button></div></div>
<script>
const numeroWhatsApp="56995320821";
const grupos=[
{nombre:"Consumibles",items:[["INS000072","Protector de polos"],["INS000240","Limpiador de frenos x Litro"],["HER000202","Limpiador dielectrico x Litro"],["PIN000203","Paños"],["HER000092","Limpia contacto"],["HER000094","Lubricante Spray"],["ACE000019","Spray grasa dieléctrica"],["HER000051","Grasa EP2 x kg"],["INS000023","Silicona"],["ELE002580","Amarra plástica 20 cm"],["ELE000060","Amarra plástica 10 cm"],["ELE000061","Amarra plástica 14 cm"],["ELE002234","Amarra plástica 17 cm"],["ELE000062","Amarra plástica 19 cm"],["ELE000063","Amarra plástica 28 cm"],["ELE000064","Amarra plástica 30 cm"],["ELE002233","Amarra plástica 36 cm"],["ELE000065","Amarra plástica 37 cm"],["ELE000066","Amarra plástica 40 cm"],["ELE000067","Amarra plástica 50 cm"],["ELE000068","Amarra plástica 55 cm"],["ELE000069","Amarra plástica 76 cm"]]},
{nombre:"Abrasivos, corte y soldadura",items:[["HER000036","Disco lija c/velcro 6' N°120"],["HER000039","Disco lija c/velcro 6' N°100"],["HER000037","Disco lija c/velcro 6' N°150"],["HER000030","Disco lija c/velcro 6' N°180"],["HER000041","Disco lija c/velcro 6' N°220"],["HER000043","Disco lija c/velcro 6' N°320"],["HER000038","Disco lija c/velcro 6' N°60"],["HER000287","Disco lija c/velcro 6' N°80"],["HER000294","Disco lija c/velcro 6 N°240"],["HER000042","Disco lija c/velcro 6 N°280"],["INS000053","Disco lija c/velcro 6' N°360"],["HER000027","Disco de corte 4 1/2"],["HER000154","Disco de corte 7 x 1,6mm"],["HER000028","Disco de desbaste metal 4 1/2"],["HER000044","Disco traslapado 4 1/2 GR60"],["HER000222","Grata"],["ELE000805","Soldadura 6011 3/32"],["ELE001846","Soldadura 7018 3/32"]]},
{nombre:"Adhesivos y sellado",items:[["INS000141","Pegatanke"],["HER000064","Pegamento La Gotita 2ml"]]},
{nombre:"Eléctricos",items:[["ELE000691","Terminales paleta hembra azul"],["ELE000657","Switch potenciometro"],["ELE000848","Terminales paleta macho azul"],["ELE000703","Terminales ojo azul 5mm"],["ELE000705","Terminales ojo azul 10mm"],["ELE003255","GPS nuevo"],["ELE002596","Portafusible ATO 1-20A"],["ELE002025","Mantención motor eléctrico"],["ELE001674","Fusible ATO 3 AMP"],["ELE002742","Relay 12V 5P"],["ELE000681","Bornes batería x un."],["ELE002609","Cable 2 vías"],["ELE002610","Cable 3 vías"],["ELE001380","Cable batería"],["ELE000180","Chapa contacto JLG 3 posiciones"],["ELE000664","Switch 2 posiciones con retorno"],["ELE000669","Switch 3 posiciones con retorno"],["ELE000601","Parada emergencia original JLG"],["ELE000477","Perilla potenciómetro"],["ELE001323","Pin macho joystick tijeras"],["ELE001322","Pin hembra joystick tijeras"],["ELE002973","Porta relay cerámica"],["ELE002314","Porta relay 5 PIN"]]},
{nombre:"Hidráulicos",items:[["HID003984","Espiral protector 1/4\" (14-17mm)"],["HID003986","Espiral protector 1/2\" (22-27mm)"],["HID003987","Espiral protector 3/4\" (28-35mm)"],["HID003988","Espiral protector 1\" (36-46mm)"],["HID001210","Flexibles hidráulicos según muestra"],["HID003660","Kit sellos para masas general"],["HID002227","Kit sellos motor de giro general"],["HID002622","Manguera combustible 1/2"],["HID001655","Visor hidráulico 1250AJP"]]},
{nombre:"Componentes mayores",items:[["MOT001287","Motor de arranque"],["MOT001203","Alternador"],["BAT000002","Batería 12V 100Ah"],["BAT000003","Batería 12V 150Ah"],["BAT000086","Batería 12V 220Ah"]]},
{nombre:"Carrocería y estructura",items:[["ELE000340","Manibela mesa motor"],["MEC003679","Bombín capot 17AJRT"],["MEC000581","Bombín capot 1250AJP"],["ADH000150","Mica comando canastillo 1250AJP"]]},
{nombre:"Instrumentación",items:[["ELE000322","Horómetro de reemplazo"]]},
{nombre:"Fluidos",items:[["ACE000036","Aceite motor 15W40 Tineta 19 L"],["ACE000005","Aceite motor 15W40 Tambor 200 L"],["ACE000035","Aceite hidráulico NUTO 46 Tineta 19 L"],["ACE000003","Aceite hidráulico NUTO 46 Tambor 200 L"],["HER000095","Refrigerante / Coolant al 50% Tineta 19 L"],["ACE000052","Aceite Diferencial LS 85W90 Tineta 19 L"],["ACE000054","Aceite Diferencial LS 85W90 Tambor 200 L"],["INS000165","Gas refrigerante A/C"]]},
{nombre:"Ferretería",items:[["PER000483","Pernos por muestra"],["PER000184","Tuercas por muestra"],["PER000030","Golillas por muestra"],["MEC001195","Abrazadera cremallera metálica 10-16mm"]]},
{nombre:"Documentación",items:[["MEC003191","Portadocumentos"]]},
{nombre:"Kits de filtros 250 h",items:[["FILALO0001","Kit filtros 250h - 10-70 / 17-40 FH/FM - DEUTZ 2012"],["FILALO0002","Kit filtros 250h - 10-70 / 17-40 FR - DEUTZ 2012"],["FILALO0003","Kit filtros 250h - 1200SJP / 1250AJP / 1350SJP - DEUTZ TD2011"],["FILALO0004","Kit filtros 250h - 450AJSII / 600AJ / 800AJ / 860SJ - DEUTZ D2011"],["FILALO0005","Kit filtros 250h - 450AJSII / 600AJ - DEUTZ D2011"],["FILALO0006","Kit filtros 250h - 17AJ Spider / SJP315 / Eager Beaver - HONDA GX340/GX340I"],["FILALO0007","Kit filtros 250h - 340AJ - KUBOTA D1105"],["FILALO0008","Kit filtros 250h - 140 RTE - KUBOTA D1105"],["FILALO0009","Kit filtros 250h - 800AJ/860SJ/4394RT/S-65/S-85/Z-45/Z-60/Z-62/Z-135 - DEUTZ D2011"],["FILALO0010","Kit filtros 250h - 6.26 Faresin - YANMAR"],["FILALO0011","Kit filtros 250h - 17AJRT Alorental - DEUTZ D2011L"],["FILALO0012","Kit filtros 250h - 16AJ Alolift/Alorental - HATZ"],["FILALO0013","Kit filtros 250h - 20AJ RT / 24TJ RT / 26AJ RT - CUMMINS 2.8"],["FILALO0014","Kit filtros 250h - 1500SJP / 1250AJP / 800AJ - DEUTZ TD 2.9"],["FILALO0015","Kit filtros 250h - G10-43A - CUMMINS"],["FILALO0016","Kit filtros 250h - G10-43A - CUMMINS"],["FILALO0017","Kit filtros 250h - 15AJ RT - YANMAR"],["FILALO0018","Kit filtros 250h - 1850SJP - DEUTZ TD 3.2"],["FILALO0019","Kit filtros 250h - S80 - CAT 804D-33"],["FILALO0020","Kit filtros 250h - 307 - DEUTZ D2012"],["FILALO0021","Kit filtros 250h - M600 - YANMAR"],["FILALO0022","Kit filtros 250h - GS2669RT - KUBOTA"],["FILALO0023","Kit filtros 250h - 120SXJ - DEUTZ"],["FILALO0024","Kit filtros 250h - 450AJ SII - PERKINS 404"],["FILALO0025","Kit filtros 250h - 21AJ Spider - HATZ"],["FILALO0026","Kit filtros 250h - 860SJ - PERKINS 404T"],["FILALO0027","Kit filtros 250h - Z-45/25 - PERKINS 404"],["FILALO0029","Kit filtros 250h - 12AJ BB - YANMAR"],["FILALO0030","Kit filtros 250h - ZX-135/70 - PERKINS"],["FILALO0031","Kit filtros 250h - S125 - PERKINS"],["FILALO0032","Kit filtros 250h - 120RTE - YANMAR"],["FILALO0033","Kit filtros 250h - 140RT - KUBOTA D1105"],["FILALO0036","Kit filtros 250h - 34AJX - CUMMINS"],["FILALO0038","Kit filtros 250h - 10-70/17-40 FR - DEUTZ 3.8 EU5"]]}
];

function ordenarItemsPorDescripcion(){
  grupos.forEach(grupo => {
    grupo.items.sort((a, b) =>
      a[1].localeCompare(b[1], "es", { sensitivity: "base", numeric: true })
    );
  });
}

function normalizarTexto(texto){return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}

function crearFormulario(){const cont=document.getElementById("formulario"),sel=document.getElementById("modelo");grupos.forEach((g,gi)=>{const sec=document.createElement("div");sec.className="section";sec.dataset.group=gi;sec.innerHTML=`<div class="section-header"><input type="checkbox" id="grupo-${gi}" onchange="toggleGrupo(${gi},this.checked)"><label for="grupo-${gi}" style="margin:0;color:white;cursor:pointer">${g.nombre}</label></div><div class="section-body"></div>`;const body=sec.querySelector(".section-body");g.items.forEach((it,ii)=>{const row=document.createElement("div");row.className="item-row";row.dataset.search=(it[0]+" "+it[1]+" "+g.nombre).toLowerCase();row.innerHTML=`<span class="code">${it[0]}</span><span class="name">${it[1]}</span><input type="number" class="qty" min="0" step="1" placeholder="Cant." disabled data-group="${gi}" data-index="${ii}" oninput="generarSalida()">`;body.appendChild(row);if(g.nombre==="Kits de filtros 250 h"){const opt=document.createElement("option");opt.value=`${gi}-${ii}`;opt.textContent=`${it[0]} | ${it[1]}`;sel.appendChild(opt)}});cont.appendChild(sec)})}
function toggleGrupo(gi,activo){const sec=document.querySelector(`.section[data-group="${gi}"]`);sec.classList.toggle("active",activo);document.querySelectorAll(`.qty[data-group="${gi}"]`).forEach(i=>{i.disabled=!activo;if(!activo)i.value=""});generarSalida()}
function seleccionarKit(){const v=document.getElementById("modelo").value;if(!v)return;const[gi,ii]=v.split("-").map(Number);document.getElementById(`grupo-${gi}`).checked=true;toggleGrupo(gi,true);const input=document.querySelector(`.qty[data-group="${gi}"][data-index="${ii}"]`);input.value=1;generarSalida()}
function generarSalida(alerta=false){const equipo=document.getElementById("equipo").value.trim();const m=new Map();document.querySelectorAll(".qty").forEach(input=>{const qty=Number(input.value);if(input.disabled||!qty||qty<=0)return;const gi=Number(input.dataset.group),ii=Number(input.dataset.index);const[cod,desc]=grupos[gi].items[ii];const key=cod+"|"+desc;if(!m.has(key))m.set(key,{cod,desc,qty:0});m.get(key).qty+=qty});let txt="Codigo\tDescripcion\tCantidad\tEquipo\n";Array.from(m.values()).sort((a,b)=>a.desc.localeCompare(b.desc, 'es', {sensitivity:'base', numeric:true})).forEach(r=>txt+=`${r.cod}\t${r.desc}\t${r.qty}\t${equipo}\n`);document.getElementById("salida").value=m.size?txt:"";if(alerta&&!m.size)alert("No hay elementos seleccionados.")}
function copiarSalida(){generarSalida(true);const salida=document.getElementById("salida");if(!salida.value.trim())return;navigator.clipboard.writeText(salida.value).then(()=>alert("Copiado. Puedes pegar directo en Excel.")).catch(()=>{salida.select();document.execCommand("copy");alert("Copiado. Puedes pegar directo en Excel.")})}
function enviarWhatsApp(){generarSalida(true);const t=document.getElementById("salida").value.trim();if(!t){alert("No hay datos para enviar.");return}window.open(`https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(t)}`,"_blank")}
function limpiarFormulario(){if(!confirm("¿Limpiar formulario?"))return;document.getElementById("equipo").value="";document.getElementById("om").value="";document.getElementById("modelo").value="";document.getElementById("busqueda").value="";document.querySelectorAll(".section-header input").forEach(c=>c.checked=false);document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));document.querySelectorAll(".qty").forEach(i=>{i.value="";i.disabled=true});document.querySelectorAll(".item-row").forEach(r=>r.style.display="grid");document.getElementById("salida").value=""}
function filtrarItems(){const q=normalizarTexto(document.getElementById("busqueda").value.trim());document.querySelectorAll(".item-row").forEach(r=>r.style.display=!q||normalizarTexto(r.dataset.search).includes(q)?"grid":"none");document.querySelectorAll(".section").forEach(sec=>{const gi=sec.dataset.group;const checked=document.getElementById(`grupo-${gi}`).checked;const tieneCoincidencias=Array.from(sec.querySelectorAll(".item-row")).some(r=>r.style.display!=="none");sec.classList.toggle("active",q?tieneCoincidencias||checked:checked)})}
ordenarItemsPorDescripcion();
crearFormulario();
</script></body></html>
