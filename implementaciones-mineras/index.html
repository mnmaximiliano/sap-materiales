<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario Implementaciones Mineras</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="container">
  <div class="card">
    <h2>Implementaciones Kit Minero</h2>

    <div class="grid-info">
      <div>
        <label for="cliente">Cliente</label>
        <input type="text" id="cliente" placeholder="Ej: MEL, CEIM, FCAB" oninput="generarSalida()">
      </div>
      <div>
        <label for="faena">Faena / Minera</label>
        <input type="text" id="faena" placeholder="Ej: Minera Escondida" oninput="generarSalida()">
      </div>
      <div>
        <label for="equipo">Equipo / Número interno *</label>
        <input type="text" id="equipo" placeholder="Ej: BAP-0314" oninput="generarSalida()">
      </div>
      <div>
        <label for="om">OM / SD / Reserva</label>
        <input type="text" id="om" placeholder="Ej: OM 79766" oninput="generarSalida()">
      </div>
      <div>
        <label for="solicitante">Solicitante</label>
        <input type="text" id="solicitante" placeholder="Nombre" oninput="generarSalida()">
      </div>
      <div>
        <label for="destinoWhatsApp">Enviar WhatsApp a</label>
        <select id="destinoWhatsApp">
          <option value="56995320821">Maximiliano Matamala</option>
          <option value="56966588858">Alejandro Araya</option>
        </select>
      </div>
      <div>
        <label for="observacion">Observación general</label>
        <input type="text" id="observacion" placeholder="Ej: Implementación solicitada por cliente" oninput="generarSalida()">
      </div>
    </div>

    <div id="formulario"></div>
  </div>

  <div>
    <div class="card output-box">
      <h3>Salida consolidada para Excel / SAP</h3>
      <p class="note">
        La salida suma automáticamente códigos repetidos. Copia desde WhatsApp y pega directo en Excel.
      </p>
      <div id="contadorMateriales" class="counter">Materiales seleccionados: 0</div>
      <textarea id="salida" readonly placeholder="Selecciona una implementación y completa cantidades..."></textarea>
      <button class="btn btn-generate" onclick="generarSalida(true)">Generar salida</button>
      <button class="btn btn-copy" onclick="copiarSalida()">Copiar al portapapeles</button>
      <button class="btn btn-copy" onclick="descargarTSV()">Descargar TSV</button>
      <button class="btn btn-wa" onclick="enviarWhatsApp()">Enviar a mi WhatsApp</button>
      <button class="btn btn-clear" onclick="limpiarFormulario()">Limpiar formulario</button>
    </div>
  </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
