<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario Implementaciones Mineras</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1250px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 430px;
      gap: 20px;
    }
    @media (max-width: 950px) {
      .container { grid-template-columns: 1fr; }
      .output-box { position: static !important; }
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.06);
    }
    h2, h3 {
      margin-top: 0;
      color: #1e3d59;
      border-bottom: 2px solid #ffc13b;
      padding-bottom: 8px;
    }
    .grid-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (max-width: 700px) { .grid-info { grid-template-columns: 1fr; } }
    label {
      display: block;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 5px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    .section {
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-top: 16px;
      overflow: hidden;
      background: #fff;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1e3d59;
      color: #fff;
      padding: 10px 12px;
      font-weight: 700;
    }
    .section-header input { transform: scale(1.2); }
    .section-body { padding: 10px 12px; display: none; }
    .section.active .section-body { display: block; }
    .item-row {
      display: grid;
      grid-template-columns: 115px 1fr 95px;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 7px 0;
    }
    .item-row:last-child { border-bottom: none; }
    .code {
      font-family: Consolas, monospace;
      color: #c62828;
      font-weight: 700;
      font-size: 13px;
    }
    .name { font-size: 13px; }
    .qty-input { text-align: center; font-weight: 700; }
    .qty-input:disabled { background: #f2f2f2; color: #999; }
    .hint {
      font-size: 12px;
      color: #666;
      margin-top: 3px;
    }
    textarea {
      width: 100%;
      height: 370px;
      box-sizing: border-box;
      font-family: Consolas, monospace;
      font-size: 12px;
      padding: 10px;
      border: 1px solid #c8e6c9;
      border-radius: 5px;
      background: #fafafa;
      resize: vertical;
    }
    .output-box {
      background: #e8f5e9;
      border: 2px dashed #2e7d32;
      position: sticky;
      top: 20px;
    }
    .btn {
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 5px;
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-generate { background: #1e3d59; }
    .btn-copy { background: #2e7d32; }
    .btn-wa { background: #25D366; color: #0b3d1e; }
    .btn-clear { background: #777; }
    .note {
      font-size: 12px;
      margin: 8px 0 12px;
      color: #3e2723;
    }
  </style>
</head>

    <div class="grid-info">

      <div>
        <label for="om">OM / SD / Reserva</label>
        <input type="text" id="om" placeholder="Ej: OM 79766" oninput="generarSalida()">
      </div>
      <div>
        <label for="solicitante">Solicitante</label>

      </div>
      <div>

    </div>

      <textarea id="salida" readonly placeholder="Selecciona una implementación y completa cantidades..."></textarea>
      <button class="btn btn-generate" onclick="generarSalida(true)">Generar salida</button>
      <button class="btn btn-copy" onclick="copiarSalida()">Copiar al portapapeles</button>
      <button class="btn btn-wa" onclick="enviarWhatsApp()">Enviar a mi WhatsApp</button>

function crearFormulario() {
  const contenedor = document.getElementById("formulario");
  contenedor.innerHTML = "";

  implementaciones.forEach((grupo, gIndex) => {
    const section = document.createElement("div");
    section.className = "section";
    section.dataset.group = gIndex;

    const header = document.createElement("div");
    header.className = "section-header";
    header.innerHTML = `
      <input type="checkbox" id="grupo-${gIndex}" onchange="toggleGrupo(${gIndex}, this.checked)">
      <label for="grupo-${gIndex}" style="margin:0; color:white; cursor:pointer;">${grupo.nombre}</label>
    `;

    const body = document.createElement("div");
    body.className = "section-body";

    grupo.items.forEach((item, iIndex) => {
      const row = document.createElement("div");
      row.className = "item-row";
      const defaultValue = item.qty !== null ? item.qty : "";
      const placeholder = item.multiplier ? "Rollos" : "Cant.";
      const step = 1;

      row.innerHTML = `
        <span class="code">${item.cod}</span>
        <span class="name">${item.nom}${item.hint ? `<div class="hint">${item.hint}</div>` : ""}</span>
        <input
          type="number"
          class="qty-input"
          min="0"
          step="${step}"
          value="${defaultValue}"
          placeholder="${placeholder}"
          data-group="${gIndex}"
          data-index="${iIndex}"
          disabled
          oninput="generarSalida()"
        >
      `;
      body.appendChild(row);
    });

    section.appendChild(header);
    section.appendChild(body);
    contenedor.appendChild(section);
  });
}

function toggleGrupo(gIndex, activo) {
  const section = document.querySelector(`.section[data-group="${gIndex}"]`);
  section.classList.toggle("active", activo);

  const inputs = document.querySelectorAll(`.qty-input[data-group="${gIndex}"]`);
  inputs.forEach(input => {
    const item = implementaciones[gIndex].items[input.dataset.index];
    input.disabled = !activo;

    if (activo && item.qty !== null && input.value === "") {
      input.value = item.qty;
    }

    if (!activo) {
      input.value = item.qty !== null ? item.qty : "";
    }
  });

  generarSalida();
}

function obtenerDatosGenerales() {
  return {
    cliente: document.getElementById("cliente").value.trim(),
    faena: document.getElementById("faena").value.trim(),
    equipo: document.getElementById("equipo").value.trim(),
    om: document.getElementById("om").value.trim(),
    solicitante: document.getElementById("solicitante").value.trim(),
    observacion: document.getElementById("observacion").value.trim()
  };
}

function generarSalida(mostrarAlerta = false) {
  const datos = obtenerDatosGenerales();
  const consolidado = new Map();
  const errores = [];

  implementaciones.forEach((grupo, gIndex) => {
    const activo = document.getElementById(`grupo-${gIndex}`).checked;
    if (!activo) return;

    grupo.items.forEach((item, iIndex) => {
      const input = document.querySelector(`.qty-input[data-group="${gIndex}"][data-index="${iIndex}"]`);
      const cantidadIngresada = Number(input.value);

      if (!cantidadIngresada || cantidadIngresada <= 0) return;

      const cantidad = item.multiplier
        ? cantidadIngresada * item.multiplier
        : cantidadIngresada;

      const codigo = item.cod.trim();

      if (!consolidado.has(codigo)) {
        consolidado.set(codigo, {
          codigo,
          cantidad: 0,
          detalles: []
        });
      }

      const registro = consolidado.get(codigo);
      registro.cantidad += cantidad;

      if (item.multiplier) {
        registro.detalles.push(`${grupo.nombre} - ${item.nom} (${cantidadIngresada} x ${item.multiplier} = ${cantidad})`);
      } else {
        registro.detalles.push(`${grupo.nombre} - ${item.nom} (${cantidad})`);
      }
    });
  });

  if (errores.length > 0 && mostrarAlerta) {
    alert(errores.join("\n"));
  }

  let texto = "CODIGO\tCANTIDAD\tEQUIPO\tCLIENTE\tFAENA\tOM_SD\tSOLICITANTE\tDETALLE\tOBSERVACION\n";

  const filas = Array.from(consolidado.values()).sort((a, b) => a.codigo.localeCompare(b.codigo));

  filas.forEach(reg => {
    texto += `${reg.codigo}\t${reg.cantidad}\t${datos.equipo}\t${datos.cliente}\t${datos.faena}\t${datos.om}\t${datos.solicitante}\t${reg.detalles.join(" | ")}\t${datos.observacion}\n`;
  });

  document.getElementById("salida").value = filas.length > 0 ? texto : "";
  return filas.length > 0;
}

function copiarSalida() {
  generarSalida(true);
  const salida = document.getElementById("salida");

  if (!salida.value.trim()) {
    alert("No hay datos para copiar.");
    return;
  }

  navigator.clipboard.writeText(salida.value)
    .then(() => alert("Información copiada. Puedes pegarla directamente en Excel."))
    .catch(() => {
      salida.select();
      document.execCommand("copy");
      alert("Información copiada. Puedes pegarla directamente en Excel.");
    });
}

function enviarWhatsApp() {
  const hayDatos = generarSalida(true);
  const salida = document.getElementById("salida").value.trim();

  if (!hayDatos || !salida) {
    alert("No hay datos para enviar.");
    return;
  }

  const datos = obtenerDatosGenerales();
  const encabezado = `Solicitud implementación kit minero - Equipo: ${datos.equipo || "Sin equipo"}\n\n`;
  const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(encabezado + salida)}`;
  window.open(url, "_blank");
}

function limpiarFormulario() {
  if (!confirm("¿Deseas limpiar el formulario?")) return;

  document.querySelectorAll("input[type='text']").forEach(input => input.value = "");
  document.querySelectorAll(".section-header input[type='checkbox']").forEach(chk => chk.checked = false);
  document.querySelectorAll(".section").forEach(sec => sec.classList.remove("active"));

  document.querySelectorAll(".qty-input").forEach(input => {
    const gIndex = input.dataset.group;
    const iIndex = input.dataset.index;
    const item = implementaciones[gIndex].items[iIndex];
    input.value = item.qty !== null ? item.qty : "";
    input.disabled = true;
  });

  document.getElementById("salida").value = "";
}

crearFormulario();
