<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formularios SAP</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2933;
    }

    main {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      margin: 0 0 24px;
      color: #64748b;
    }

    .links {
      display: grid;
      gap: 14px;
    }

    a {
      display: block;
      padding: 16px 18px;
      border-radius: 12px;
      text-decoration: none;
      color: #ffffff;
      background: #16324f;
      font-weight: 700;
      transition: 0.2s ease;
    }

    a:hover {
      background: #0f2238;
      transform: translateY(-1px);
    }
  </style>
</head>

<body>
  <main>
    <section class="card">
      <h1>Formularios SAP</h1>
      <p>Selecciona el formulario que deseas utilizar.</p>

      <div class="links">
        <a href="./materiales-pintura/">Materiales pintura</a>
        <a href="./implementaciones-mineras/">Implementaciones mineras</a>
        <a href="./elementos-frecuentes/">Elementos frecuentes</a>
      </div>
    </section>
  </main>
</body>
</html>
